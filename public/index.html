<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>JARVIS</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; display: flex; flex-direction: column; align-items: center; padding: 60px 20px; }
  h1 { letter-spacing: 2px; color: #58a6ff; }
  #micBtn { width: 120px; height: 120px; border-radius: 50%; border: none; background: #238636; color: white; font-size: 18px; cursor: pointer; transition: background 0.2s; }
  #micBtn.listening { background: #da3633; }
  #transcript { margin-top: 30px; font-size: 18px; min-height: 24px; color: #8b949e; }
  #reply { margin-top: 10px; font-size: 20px; max-width: 600px; text-align: center; }
  #status { margin-top: 40px; font-size: 13px; color: #6e7681; }
</style>
</head>
<body>
  <h1>J A R V I S</h1>
  <button id="micBtn">🎙 Hold / Click to talk</button>
  <div id="transcript"></div>
  <div id="reply"></div>
  <div id="status">checking devices...</div>

<script>
const micBtn = document.getElementById('micBtn');
const transcriptEl = document.getElementById('transcript');
const replyEl = document.getElementById('reply');
const statusEl = document.getElementById('status');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
  statusEl.textContent = 'Speech recognition not supported in this browser. Use Chrome or Edge.';
}

let recognizing = false;
let recognition;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    transcriptEl.textContent = `You: ${text}`;
    sendCommand(text);
  };

  recognition.onend = () => {
    recognizing = false;
    micBtn.classList.remove('listening');
  };

  recognition.onerror = (e) => {
    recognizing = false;
    micBtn.classList.remove('listening');
    statusEl.textContent = `Mic error: ${e.error}`;
  };
}

micBtn.addEventListener('click', () => {
  if (!recognition) return;
  if (recognizing) {
    recognition.stop();
    return;
  }
  recognizing = true;
  micBtn.classList.add('listening');
  recognition.start();
});

async function sendCommand(transcript) {
  replyEl.textContent = '...';
  try {
    const res = await fetch('/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript }),
    });
    const data = await res.json();
    const reply = data.reply || data.error || 'No response.';
    replyEl.textContent = reply;
    speak(reply);
  } catch (err) {
    replyEl.textContent = 'Error reaching backend: ' + err.message;
  }
}

function speak(text) {
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1;
  speechSynthesis.speak(utter);
}

async function refreshDeviceStatus() {
  try {
    const res = await fetch('/api/devices');
    const devices = await res.json();
    statusEl.textContent = devices.length
      ? `${devices.length} device(s) connected: ${devices.map(d => d.name).join(', ')}`
      : 'No devices connected yet.';
  } catch {
    statusEl.textContent = 'Backend not reachable.';
  }
}
refreshDeviceStatus();
setInterval(refreshDeviceStatus, 5000);
</script>
</body>
</html>
